<h1 id="h">Hello from a packed page</h1>
<p>This page was stored LZMA-compressed inside <code>packed-bytes.html</code> (or <code>packed-base64.html</code>), unpacked by a small decoder, and written into the browser. Unicode survives the trip: caf&eacute; &#9731; &#127820; &mdash; &ldquo;quotes&rdquo;.</p>
<button id="b">Count clicks: 0</button>
<script>
var n = 0, b = document.getElementById('b');
b.onclick = function () { b.textContent = 'Count clicks: ' + (++n); };
document.title = 'unpacked ok';
// some repeated text so there is something to compress:
var filler = '<!-- ' + new Array(200).join('lorem ipsum dolor sit amet ') + ' -->';
</script>
